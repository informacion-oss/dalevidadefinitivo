<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>¡Pedido confirmado! · DaleVida</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Playfair+Display:wght@700;800&family=DM+Sans:wght@400;500;700&display=swap" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" />
<style>
  :root { --brand-dark: #2B5A3E; --brand-light: #7DC142; --brand-cream: #F7F5EE; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', sans-serif; background: var(--brand-cream); color: #191d17; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .card { background: white; max-width: 540px; width: 100%; padding: 48px 32px; border-radius: 32px; box-shadow: 0 20px 60px rgba(43,90,62,0.15); text-align: center; }
  .check-circle { width: 96px; height: 96px; margin: 0 auto 24px; background: rgba(125,193,66,0.18); border-radius: 100%; display: flex; align-items: center; justify-content: center; }
  .check-circle .material-symbols-outlined { font-size: 56px; color: var(--brand-light); font-variation-settings: 'FILL' 1; }
  h1 { font-family: 'Playfair Display', serif; font-size: 32px; color: var(--brand-dark); margin-bottom: 12px; line-height: 1.2; }
  p { color: #41493e; font-size: 16px; line-height: 1.6; margin-bottom: 28px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; background: var(--brand-dark); color: white; padding: 16px 32px; border-radius: 999px; text-decoration: none; font-weight: 700; font-size: 15px; font-family: 'Plus Jakarta Sans', sans-serif; transition: transform 0.2s, box-shadow 0.2s; box-shadow: 0 4px 12px rgba(43,90,62,0.25); }
  .btn:hover { transform: scale(1.02); box-shadow: 0 8px 20px rgba(43,90,62,0.35); }
  .btn-secondary { background: white; color: var(--brand-dark); border: 1.5px solid var(--brand-dark); margin-left: 8px; }
  .session-id { font-family: monospace; font-size: 11px; color: #717a6d; margin-top: 24px; word-break: break-all; }
</style>
</head>
<body>
<div class="card">
  <div class="check-circle">
    <span class="material-symbols-outlined">check_circle</span>
  </div>
  <h1>¡Pedido confirmado!</h1>
  <p>Gracias por confiar en DaleVida. Te hemos enviado un email con todos los detalles. Tu pedido llegará en 24-48h laborables.</p>
  <a href="index.html" class="btn">Volver al inicio</a>
  <a href="productos.html" class="btn btn-secondary">Seguir comprando</a>
  <div class="session-id" id="sid"></div>
</div>
<script>
  // Vaciar carrito al confirmar
  localStorage.removeItem('dalevida_cart_v1');
  // Mostrar ID de sesión por si el cliente necesita referenciarlo
  const params = new URLSearchParams(window.location.search);
  const sid = params.get('session_id');
  if (sid) {
    document.getElementById('sid').textContent = 'Ref. pedido: ' + sid;
  }
</script>
  <script src="/cookie-banner.js" defer></script>
</body>
</html>
